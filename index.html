<!DOCTYPE html>

    <!-- Preconnect to Fonts Server to reduce FCP/LCP latency -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />

    <link rel="dns-prefetch" href="https://res.cloudinary.com" />

    <!-- Preload LCP hero image from Cloudinary CDN for mobile LCP -->
    <link rel="preload" as="image" href="https://res.cloudinary.com/qzlxlo1n/image/upload/f_auto,q_auto:eco,w_450/hero_arborist_q6wspn" fetchpriority="high" />
